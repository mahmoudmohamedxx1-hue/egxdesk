<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>T29 puter probe</title></head>
<body style="font-family:monospace;white-space:pre-wrap;padding:12px">
<div id="out">loading puter.js…</div>
<script src="https://js.puter.com/v2/"></script>
<script>
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
(async () => {
  try {
    log("puter loaded: " + (typeof window.puter !== "undefined"));
    // 1) list models if available
    try {
      const lm = await puter.ai.chat.listModels();
      log("listModels: " + JSON.stringify(lm).slice(0, 3000));
    } catch (e) { log("listModels FAILED: " + String(e && e.message || e).slice(0, 300)); }
    // 2) anonymous chat
    try {
      const r = await puter.ai.chat("Reply with exactly: PUTER_WORKS", { model: "gpt-4o-mini" });
      const txt = typeof r === "string" ? r : (r && r.message && r.message.content) || JSON.stringify(r).slice(0, 300);
      log("chat gpt-4o-mini ANON_OK: " + String(txt).slice(0, 300));
    } catch (e) { log("chat gpt-4o-mini FAILED: " + String(e && e.message || e).slice(0, 500)); }
    // 3) claude
    try {
      const r2 = await puter.ai.chat("Reply with exactly: CLAUDE_WORKS", { model: "claude-3-7-sonnet" });
      const t2 = typeof r2 === "string" ? r2 : (r2 && r2.message && r2.message.content) || JSON.stringify(r2).slice(0, 300);
      log("chat claude ANON_OK: " + String(t2).slice(0, 300));
    } catch (e) { log("chat claude FAILED: " + String(e && e.message || e).slice(0, 500)); }
    log("PROBE_DONE");
  } catch (e) {
    log("outer crash: " + String(e).slice(0, 400));
  }
})();
</script>
</body>
</html>
