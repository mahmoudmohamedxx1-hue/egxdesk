<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>T29 puter probe 2</title></head>
<body style="font-family:monospace;white-space:pre-wrap;padding:12px">
<div id="out">probe2 loading…</div>
<script src="https://js.puter.com/v2/"></script>
<script>
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
(async () => {
  try {
    puter.quiet = true;
    for (const name of ["puter.ai.listModels", "puter.ai.chat.listModels", "puter.ai.listModelProviders", "puter.ai.chat.listModelProviders"]) {
      const fn = name.split(".").reduce((o, k) => (o == null ? o : o[k]), window);
      log(name + " typeof=" + typeof fn);
      if (typeof fn === "function") {
        try {
          const r = await fn.call(null);
          const s = JSON.stringify(r);
          log(name + " -> " + s.slice(0, 4000));
        } catch (e) { log(name + " FAILED: " + String(e && e.message || e).slice(0, 300)); }
      }
    }
    log("PROBE2_DONE");
  } catch (e) { log("outer crash: " + String(e).slice(0, 400)); }
})();
</script>
</body>
</html>
